<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Suns Auto Supply Catalog</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    #pdfViewer {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }

    #mobileViewer {
      display: none;
    }

    @media (max-width: 768px) {
      #pdfViewer {
        display: none;
      }

      #mobileViewer {
        display: flex;
        width: 100%;
        height: 100vh;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }

      #mobileViewer a {
        background: #111;
        color: white;
        text-decoration: none;
        padding: 16px 28px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
      }
    }
  </style>
</head>

<body>

  <iframe
    id="pdfViewer"
    src="Catalogue.pdf">
  </iframe>

  <div id="mobileViewer">
    <a href=" ">
      View Full Catalog
    </a >
  </div>

</body>
</html>
